# Nginx configuration for FileBrowser with WebDAV adapter
# 
# Place this in /etc/nginx/sites-available/ and symlink to sites-enabled
# Update the paths to your SSL certificates

# Default server block - reject unknown SNI/hosts
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    
    # Self-signed or dummy cert for rejecting connections
    ssl_certificate /etc/ssl/certs/files.example.com.crt;
    ssl_certificate_key /etc/ssl/private/files.example.com.key;
    
    # Reset connection immediately
    return 444;
}

server {
    listen 80;
    server_name files.example.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name files.example.com;

    # SSL certificates - update these paths
    ssl_certificate /etc/ssl/certs/files.example.com.crt;
    ssl_certificate_key /etc/ssl/private/files.example.com.key;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Increase max body size for file uploads (adjust as needed)
    client_max_body_size 10G;
    
    # Disable buffering for streaming
    proxy_buffering off;
    proxy_request_buffering off;

    # WebDAV adapter - handle /webdav/ requests
    # Note: Pass the full path including /webdav prefix to the adapter
    # The adapter must be configured with WEBDAV_PREFIX=/webdav
    location /webdav/ {
        # WebDAV adapter backend - no trailing slash to preserve /webdav prefix
        proxy_pass http://127.0.0.1:8081;
        
        # Pass original host and protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebDAV specific headers - pass as-is (adapter handles prefix)
        proxy_set_header Destination $http_destination;
        proxy_set_header Overwrite $http_overwrite;
        
        # Allow all WebDAV methods
        proxy_method $request_method;
        
        # Timeouts for large file transfers
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # FileBrowser - handle all other requests
    location / {
        # FileBrowser backend
        proxy_pass http://127.0.0.1:8080;
        
        # Pass original host and protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (for FileBrowser terminal feature)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
